<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tentcomm Ops Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: white sidebar + soft grey workspace of rounded white cards; overview adds a right-hand insights column. Minimal chrome, one indigo accent, black primary actions. */
:root {
  --bg: #efeff2;
  --side: #ffffff;
  --main: #f7f7f9;
  --card: #ffffff;
  --sunk: #f4f4f6;
  --ink: #18181b;
  --ink-2: #52525b;
  --muted: #8b8b96;
  --line: #ebebef;
  --line-2: #dcdce2;
  --accent: #5b4fe0;
  --accent-soft: #efedfd;
  --accent-ink: #4a3fc4;
  --cta: #18181b;
  --cta-ink: #ffffff;
  --tip: #18181b;
  --tip-ink: #f4f4f5;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --o1: #c7c2f6; --o2: #9d94ee; --o3: #7468e6; --o4: #5b4fe0;
  --good: #16a34a; --warn: #f5a524; --serious: #ec835a; --crit: #dc3b3b; --neutral: #a1a1aa;
  --good-ink: #15803d; --warn-ink: #9a6206; --crit-ink: #c02a2a;
  --good-soft: #ecf8f0; --warn-soft: #fef5e4; --crit-soft: #fdeeee; --serious-soft: #fdf0ea; --neutral-soft: #f1f1f4;
  --good-line: #bfe6cc; --warn-line: #f6dca8; --crit-line: #f5c4c4; --serious-line: #f6cdbb; --neutral-line: #e2e2e8; --accent-line: #d4cffa;

  --f: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Geist", system-ui, sans-serif;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --side: #111114; --main: #0d0d10; --card: #15151a; --sunk: #1b1b21;
    --ink: #f4f4f5; --ink-2: #b4b4bd; --muted: #7c7c88; --line: #24242b; --line-2: #31313a;
    --accent: #8f86f0; --accent-soft: #221f3d; --accent-ink: #b3adf6; --cta: #f4f4f5; --cta-ink: #18181b; --tip: #2a2a32; --tip-ink: #f4f4f5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --o1: #2f2a5c; --o2: #4a4194; --o3: #6a5fd0; --o4: #8f86f0;
    --good-ink: #4ade80; --warn-ink: #fbbf24; --crit-ink: #f87171;
    --good-soft: #0f2418; --warn-soft: #2a2010; --crit-soft: #2c1414; --serious-soft: #2c1a12; --neutral-soft: #1e1e24;
    --good-line: #1d4a2c; --warn-line: #4d3a14; --crit-line: #5a2424; --serious-line: #55301f; --neutral-line: #33333c; --accent-line: #3b3570;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --side: #111114; --main: #0d0d10; --card: #15151a; --sunk: #1b1b21;
  --ink: #f4f4f5; --ink-2: #b4b4bd; --muted: #7c7c88; --line: #24242b; --line-2: #31313a;
  --accent: #8f86f0; --accent-soft: #221f3d; --accent-ink: #b3adf6; --cta: #f4f4f5; --cta-ink: #18181b; --tip: #2a2a32; --tip-ink: #f4f4f5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --o1: #2f2a5c; --o2: #4a4194; --o3: #6a5fd0; --o4: #8f86f0;
  --good-ink: #4ade80; --warn-ink: #fbbf24; --crit-ink: #f87171;
  --good-soft: #0f2418; --warn-soft: #2a2010; --crit-soft: #2c1414; --serious-soft: #2c1a12; --neutral-soft: #1e1e24;
  --good-line: #1d4a2c; --warn-line: #4d3a14; --crit-line: #5a2424; --serious-line: #55301f; --neutral-line: #33333c; --accent-line: #3b3570;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--card); display: grid; place-items: center; }
.brand .mark svg { width: 16px; height: 16px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 0 10px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; border: 1px solid transparent; }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: 0 1px 2px rgba(24,24,27,.06); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--crit-ink); background: var(--crit-soft); border: 1px solid var(--crit-line); min-width: 22px; height: 20px; border-radius: 999px; display: grid; place-items: center; padding: 0 6px; }
.side-card { margin-top: auto; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--main); }
.side-card b { font-weight: 600; }
.side-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.me { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.me b { display: block; font-weight: 600; font-size: 13.5px; }
.me small { color: var(--muted); font-size: 12px; }

.main { min-width: 0; background: var(--main); display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--side); flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.synced { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; width: 280px; max-width: 100%; color: var(--muted); background: var(--card); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); display: grid; place-items: center; color: var(--ink-2); position: relative; }
.icon-btn:hover { color: var(--ink); background: var(--sunk); }
.icon-btn .pip { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--card); }
.av { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line-2); }
.av.lg { width: 38px; height: 38px; font-size: 13px; background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }

.content { padding: 22px 28px 48px; display: flex; flex-direction: column; gap: 18px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 9px; font-weight: 500; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.card-h .seg { max-width: 100%; overflow-x: auto; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(24,24,27,.08), 0 0 0 1px var(--line); }
.custom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.custom input { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 9px; font-size: 13px; }
.range-note { color: var(--muted); font-size: 13px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--warn-line); background: var(--warn-soft); color: var(--warn-ink); }

/* ---------- grid + cards ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.card.flat { background: transparent; border: 0; padding: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.card-sub { color: var(--muted); font-size: 13px; margin-top: -12px; }
.ghost { border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.ghost:hover { background: var(--sunk); }
.ghost svg.i { width: 15px; height: 15px; }
.go { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); }
.go:hover { background: var(--sunk); color: var(--ink); }
.go svg.i { width: 15px; height: 15px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }
.kpis.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; }
button.kpi:hover { border-color: var(--line-2); box-shadow: 0 4px 16px rgba(24,24,27,.05); }
.kpi-h { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.kpi-h svg.i { width: 16px; height: 16px; color: var(--ink); }
.kpi .val { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .foot { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.kpi svg.spark { width: 100%; height: 28px; }

.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good-ink); background: var(--good-soft); border-color: var(--good-line); }
.delta.down { color: var(--crit-ink); background: var(--crit-soft); border-color: var(--crit-line); }
.delta.flat { color: var(--ink-2); background: var(--neutral-soft); border-color: var(--neutral-line); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit-ink); border-color: var(--crit-line); }
.pill.serious { background: var(--serious-soft); color: var(--crit-ink); border-color: var(--serious-line); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); border-color: var(--warn-line); }
.pill.good { background: var(--good-soft); color: var(--good-ink); border-color: var(--good-line); }
.pill.neutral { background: var(--neutral-soft); color: var(--ink-2); border-color: var(--neutral-line); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 3px; height: 13px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(var(--muted) 0 3px, transparent 3px 5px) !important; }
.sw { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }

.chart { width: 100%; min-height: 60px; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11.5px; font-family: var(--f); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .base-l { stroke: var(--line-2); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }

/* barcode meter */
.meter { display: flex; gap: 3px; height: 34px; }
.meter i { flex: 1; border-radius: 2px; background: var(--line); }
.meter.sm { height: 22px; gap: 2px; }
.meter-foot { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); gap: 8px; }
.big { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }

.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 12.5px; display: block; }
.sm-muted { font-size: 12.5px; color: var(--muted); }

.hbar { display: flex; gap: 2px; height: 8px; width: 100%; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.hbar > span { display: block; height: 100%; min-width: 0; }
.hbar.tall { height: 12px; }
.track { position: relative; height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.track > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }

.list { display: flex; flex-direction: column; }
.list > * { padding-block: 12px; border-bottom: 1px solid var(--line); }
.list > *:first-child { padding-top: 0; }
.list > *:last-child { border-bottom: 0; padding-bottom: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.btn { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 14px; font-weight: 500; font-size: 13.5px; background: var(--card); color: var(--ink); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:hover { opacity: .88; }
.btn.sm { padding: 5px 11px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.chip-btn:hover { color: var(--ink); }
.chip-btn[aria-pressed="true"] { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }

/* overview aside */
.hello h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.insights li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.insights li svg.i { width: 16px; height: 16px; margin-top: 2px; color: var(--ink); }
.insights b { color: var(--ink); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 18px; text-align: left; font-weight: 500; font-size: 13.5px; line-height: 1.35; min-height: 96px; }
.action:hover { border-color: var(--line-2); background: var(--sunk); }
.action svg.i { width: 18px; height: 18px; }
.snap { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding-inline: 0; text-align: left; }
.snap .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); flex: none; }
.snap .ic svg.i { width: 16px; height: 16px; }
.snap span.l { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snap b { font-weight: 600; font-variant-numeric: tabular-nums; }
.snap:hover span.l { color: var(--ink); }

/* platform cards */
.plat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.plat { border: 1px solid var(--line); text-align: left; background: var(--card); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.plat:hover { border-color: var(--line-2); }
.plat.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.plat-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.plat-h .delta { margin-left: auto; }
.plat .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; font-size: 12.5px; }
.plat .stats span { color: var(--muted); }
.plat .stats b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.plat svg { width: 100%; height: 34px; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: 10px; }
.fstep { display: grid; grid-template-columns: 84px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.fstep .fbar { height: 30px; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; font-weight: 600; font-size: 13px; min-width: 38px; color: var(--ink); }
.fstep .conv { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }

/* tasks board */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select, .toolbar input { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
.toolbar input { min-width: 0; flex: 1 1 160px; max-width: 280px; }
.toolbar .btn.primary { margin-left: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--sunk); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; padding: 4px 6px 6px; }
.col-h .n { color: var(--muted); font-weight: 500; margin-left: auto; }
.tcard { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.tcard .t { font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
.tcard .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.tcard select { font-size: 12.5px; padding: 3px 6px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--card); }
.prio { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; border: 1px solid; }
.prio.High { background: var(--crit-soft); color: var(--crit-ink); border-color: var(--crit-line); }
.prio.Medium { background: var(--warn-soft); color: var(--warn-ink); border-color: var(--warn-line); }
.prio.Low { background: var(--neutral-soft); color: var(--ink-2); border-color: var(--neutral-line); }
.empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 6px; }

/* leave */
.leave { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.leave .acts { display: flex; gap: 6px; }
.leave p { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink-2); }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--card); color: var(--ink); box-shadow: 0 24px 64px rgba(0,0,0,.18); }
dialog::backdrop { background: rgba(9, 9, 11, .35); backdrop-filter: blur(2px); }
.dlg { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.dlg h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.fld input, .fld select { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-weight: 400; color: var(--ink); }
.fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dlg .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.err { color: var(--crit-ink); font-size: 13px; }

#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--tip); color: var(--tip-ink); border-radius: 10px; padding: 9px 11px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: 260px; }
#tip .tt { font-size: 11.5px; opacity: .7; margin-bottom: 5px; }
#tip .tr { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
#tip .tr span { display: inline-flex; align-items: center; gap: 7px; }
#tip .tr i { width: 3px; height: 12px; border-radius: 2px; }
#tip .tr b { font-variant-numeric: tabular-nums; font-weight: 600; }
#toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--cta); color: var(--cta-ink); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 13.5px; z-index: 120; }

/* ---------- agency modules ---------- */
.nav { display: flex; flex-direction: column; gap: 18px; }
.count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--crit-ink); background: var(--crit-soft); border: 1px solid var(--crit-line); min-width: 22px; height: 20px; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 6px; }
.count.soft { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-line); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tabs .count { margin-left: 0; height: 18px; min-width: 20px; font-size: 11.5px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; font-size: 13px; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.sel-sm { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 10px; font-size: 13px; }
.hub { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hub h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
.hub .meta { color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.hub .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.hub .btn { display: inline-flex; align-items: center; gap: 6px; }
.hub .btn svg.i { width: 15px; height: 15px; }
.logo-sq { --c: var(--accent); width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--c) 34%, var(--card)); }
.logo-sq.lg { width: 48px; height: 48px; border-radius: 14px; font-size: 15px; }
.logo-sq.sm { width: 26px; height: 26px; border-radius: 8px; font-size: 10.5px; }
.logo-sq.xs { width: 18px; height: 18px; border-radius: 5px; font-size: 8.5px; }
.ccards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.ccard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; text-align: left; min-width: 0; }
.ccard:hover { border-color: var(--line-2); box-shadow: 0 4px 16px rgba(24,24,27,.05); }
.ccard .stats, .mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; font-size: 12.5px; }
.ccard .stats span, .mini-grid span { color: var(--muted); display: block; }
.ccard .stats b, .mini-grid b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.av-stack { display: inline-flex; }
.av-stack .av { margin-left: -5px; box-shadow: 0 0 0 2px var(--card); }
.av-stack .av:first-child { margin-left: 0; }
.stars { color: var(--warn); letter-spacing: 1px; font-size: 13px; white-space: nowrap; }
.stars .off { color: var(--line-2); }
.dots { display: inline-flex; gap: 2px; flex: none; vertical-align: middle; }
.dots .sw { width: 7px; height: 7px; border-radius: 50%; }
.sel { user-select: all; font-size: 13px; overflow-wrap: anywhere; flex: 1; text-align: right; }

/* calendar */
.cal-wrap { overflow-x: auto; margin-inline: -2px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); min-width: 690px; border-radius: 10px; overflow: hidden; }
.cal-hd { padding: 8px 10px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--main); }
.cal-day { min-height: 116px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal-day.out { background: var(--main); }
.cal-day.out .dn { color: var(--muted); }
.cal-day .dn { font-size: 12.5px; font-weight: 500; padding: 1px 6px; align-self: flex-start; border-radius: 6px; }
.cal-day.today .dn { background: var(--cta); color: var(--cta-ink); }
.cal-chip { border: 0; border-radius: 6px; padding: 3px 6px; font-size: 11.5px; display: flex; align-items: center; gap: 5px; text-align: left; color: var(--ink); min-width: 0; border-left: 3px solid var(--neutral); background: var(--sunk); }
.cal-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cal-chip:hover { filter: brightness(.97); }
.more { font-size: 11.5px; color: var(--muted); padding-left: 4px; }
.st-draft { background: var(--sunk) !important; border-left-color: var(--neutral) !important; }
.st-review { background: var(--warn-soft) !important; border-left-color: var(--warn) !important; }
.st-changes { background: var(--serious-soft) !important; border-left-color: var(--serious) !important; }
.st-scheduled { background: var(--accent-soft) !important; border-left-color: var(--accent) !important; }
.st-published { background: var(--good-soft) !important; border-left-color: var(--good) !important; }
.legend i[class^="st-"] { width: 10px; height: 10px; border-left: 3px solid; border-radius: 3px; }

/* chat */
.chat { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: clamp(520px, calc(100vh - 200px), 920px); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.chat.embed { height: 580px; grid-template-columns: minmax(0, 1fr); }
.chat-side { border-right: 1px solid var(--line); padding: 14px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background: var(--main); }
.chat-side .nav-label { padding-bottom: 4px; }
.chan { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); text-align: left; font-size: 13.5px; }
.chan .av { width: 20px; height: 20px; font-size: 8.5px; }
.chan .hash { width: 18px; text-align: center; color: var(--muted); }
.chan .cn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chan:hover { background: var(--sunk); }
.chan[aria-current="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.chan.unread { color: var(--ink); font-weight: 600; }
.chan .count { height: 18px; min-width: 20px; font-size: 11px; color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-line); }
.chat-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.chat-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.msg { display: flex; gap: 11px; align-items: flex-start; }
.msg-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg-h b { font-weight: 600; }
.msg-h .pill { padding: 0 7px; font-size: 11px; }
.msg-t { color: var(--ink); overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.5; }
.mention { color: var(--accent-ink); background: var(--accent-soft); border-radius: 4px; padding: 0 3px; font-weight: 500; }
.file { display: inline-flex; align-items: center; gap: 8px; margin-top: 7px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 11px; font-size: 13px; background: var(--main); max-width: 100%; overflow-wrap: anywhere; }
.file svg.i { width: 15px; height: 15px; color: var(--muted); }
.day-div { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.day-div::before, .day-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.composer { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line-2); border-radius: 12px; padding: 9px 12px; background: var(--card); min-height: 40px; max-height: 140px; min-width: 0; }
.ghost-attach { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--ink-2); cursor: pointer; flex: none; }
.ghost-attach:hover { background: var(--sunk); }

/* menus, banners, sharing */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 36px rgba(0,0,0,.14); padding: 6px; min-width: 220px; z-index: 60; display: flex; flex-direction: column; }
.menu button { border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--ink); }
.menu button:hover { background: var(--sunk); }
.viewas { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-ink); font-size: 13.5px; flex-wrap: wrap; }
.viewas .btn { margin-left: auto; }
.viewas svg.i { width: 16px; height: 16px; }
#viewAsBar:empty { display: none; }
.share { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px dashed var(--line-2); border-radius: 12px; padding: 10px 12px; }
.share code { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12.5px; user-select: all; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.share svg.i { width: 16px; height: 16px; color: var(--muted); }
#shareSlot:empty { display: none; }
.portal { display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 20px; border: 1px solid var(--line); background: var(--main); }
.portal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mchips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 300px; }
.mchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px 2px 5px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); cursor: pointer; background: var(--card); }
.mchip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.mchip:has(input:disabled) { opacity: .7; cursor: default; }
.mchip input, .switch input { margin: 0; accent-color: var(--accent); }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.fld textarea { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font-size: 14px; font-weight: 400; color: var(--ink); resize: vertical; }
dialog.wide { width: min(760px, calc(100vw - 32px)); }
.lines input { width: 100%; background: var(--card); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--ink); }
.lines td { padding: 6px 4px; }
.inv-doc { border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; background: var(--card); }

@media (max-width: 1240px) {
  .c3 { grid-column: span 6; } .c4, .c5, .c7, .c8, .c9 { grid-column: span 12; } .c6 { grid-column: span 6; }
  .aside { grid-column: span 12; display: grid !important; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis.six { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: 0; height: auto; z-index: 30; padding: 10px 16px; flex-direction: row; align-items: center; gap: 14px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .nav-label, .side-card, .me, .brand span { display: none; }
  .nav, .nav .nav-group { flex-direction: row; gap: 2px; }
  .chat { grid-template-columns: minmax(0, 1fr); height: auto; }
  .chat-side { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
  .msgs { max-height: 60vh; }
  .top-r .menu-wrap { order: -1; }
  .nav a { white-space: nowrap; padding: 7px 10px; }
  .top { padding: 14px 16px; }
  .search { display: none; }
  .content { padding: 16px 16px 40px; }
  .c3, .c6 { grid-column: span 12; }
  .plat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .kpis, .kpis.six { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi { padding: 14px; }
  .kpi .val { font-size: 22px; }
  .board, .plat-grid { grid-template-columns: minmax(0, 1fr); }
  .fld-row { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .view-in { animation: rise .3s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .5; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M12 7v13"/></svg></span><span>Tentcomm</span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-card">
      <b>Sample data</b>
      <p>Every number here is generated for the mockup. Connect each section to its real source when you build it.</p>
    </div>
    <div class="me"><span class="av lg">CE</span><div><b>CEO</b><small>Tentcomm</small></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <div>
        <h1 id="viewTitle">Dashboard</h1>
        <div class="synced"><span class="dot"></span><span id="synced"></span></div>
      </div>
      <div class="top-r">
        <form class="search" id="searchForm" role="search">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="globalSearch" placeholder="Search tasks…" aria-label="Search tasks">
        </form>
        <div class="menu-wrap" id="createWrap"><button class="btn primary" type="button" id="createBtn" aria-haspopup="true">+ Create</button>
          <div class="menu" id="createMenu" hidden>
            <button type="button" data-create="task"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Task</button>
            <button type="button" data-create="post"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Scheduled post</button>
            <button type="button" data-create="invoice"><svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Invoice</button>
            <button type="button" data-create="campaign"><svg class="i" viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>Influencer campaign</button>
            <button type="button" data-create="influencer"><svg class="i" viewBox="0 0 24 24"><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>Influencer</button>
            <button type="button" data-create="space"><svg class="i" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat space</button>
          </div></div>
        <button class="icon-btn" type="button" data-go="overview" aria-label="Needs attention"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="pip"></span></button>
        <span class="av lg" title="CEO">CE</span>
      </div>
    </header>
    <div class="content">
      <div id="viewAsBar"></div>
      <div class="bar">
        <div class="bar-l">
          <div class="seg" id="rangeSeg" role="group" aria-label="Date range">
            <button type="button" data-range="today">Today</button>
            <button type="button" data-range="7d">7 days</button>
            <button type="button" data-range="30d">30 days</button>
            <button type="button" data-range="custom">Custom</button>
          </div>
          <form class="custom" id="customBox" hidden>
            <input type="date" id="cStart" aria-label="Start date">
            <span>to</span>
            <input type="date" id="cEnd" aria-label="End date">
            <button class="btn sm primary" type="submit">Apply</button>
          </form>
          <span class="range-note" id="rangeNote"></span>
        </div>
        <span class="tag">Sample data</span>
      </div>
      <section id="view" aria-live="polite"></section>
    </div>
  </div>
</div>

<div id="tip" role="tooltip" hidden></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<dialog id="taskDlg">
  <form class="dlg" id="taskForm" method="dialog">
    <h2>New task</h2>
    <label class="fld">Title<input id="tTitle" maxlength="120" placeholder="e.g. Draft November content calendar" required></label>
    <div class="fld-row">
      <label class="fld">Assignee<select id="tAssignee"></select></label>
      <label class="fld">Project<select id="tProject"></select></label>
    </div>
    <div class="fld-row">
      <label class="fld">Priority<select id="tPriority"><option>High</option><option selected>Medium</option><option>Low</option></select></label>
      <label class="fld">Due date<input type="date" id="tDue" required></label>
    </div>
    <div class="fld-row">
      <label class="fld">Client<select id="tClient"></select></label>
      <label class="fld">Status<select id="tStatus"></select></label>
    </div>
    <div class="err" id="tErr" hidden></div>

const LAST = ['Rahman', 'Silva', 'Haddad', 'Kowalski', 'Tanaka', 'Moreno', 'Islam', 'Brooks', 'Petrov', 'Hossain', 'Klein', 'Varga'];

const STAGES = [{ n: 'New', c: 'info' }, { n: 'Contacted', c: 'neutral' }, { n: 'Qualified', c: 'warn' }, { n: 'Proposal sent', c: 'serious' }, { n: 'Won', c: 'good' }];
function vSales() {
  const pv = prev(), t = salesTotals(), tp = salesTotals(pv.s, pv.e);
  const today = salesDay(T), yest = sameTimeYesterday(d => salesDay(d).leads);
  const b = buckets();
  const conv = t.leads ? t.won / t.leads : 0, convP = tp.leads ? tp.won / tp.leads : 0;
  const pipeline = Math.round(t.proposals * 2100);
  const reps = REPS.map((name, i) => ({ name, w: 0.6 + R('rep', i, state.start, state.end) }));
  const tw = sum(reps.map(r => r.w));
  let wonLeft = t.won;
  reps.forEach((r, i) => { r.leads = Math.round(t.leads * r.w / tw); r.won = i === reps.length - 1 ? wonLeft : Math.min(wonLeft, Math.round(t.won * r.w / tw * (0.8 + 0.4 * R('rw', i, state.end)))); wonLeft -= r.won; r.rev = Math.round(r.won * (t.won ? t.revenue / t.won : 0) * (0.85 + 0.3 * R('rr', i))); });
  reps.sort((a, c) => c.rev - a.rev);
  const maxRev = Math.max(...reps.map(r => r.rev), 1);
  const n = Math.min(7, Math.max(today.leads, 3));
  const recent = Array.from({ length: n }, (_, k) => {
    const mins = Math.max(0, Math.floor(NOW_H * 60) - Math.floor(k * 37 + R('rt', T, k) * 30));
    return { name: `${FIRST[Math.floor(R('rf', T, k) * FIRST.length)]} ${LAST[Math.floor(R('rl', T, k) * LAST.length)]}`, company: COMPANIES[Math.floor(R('rc', T, k) * COMPANIES.length)], src: SOURCES[Math.floor(R('rs', T, k) * SOURCES.length)], owner: REPS[Math.floor(R('ro', T, k) * REPS.length)], stage: STAGES[k < 3 ? 0 : Math.floor(R('rst', T, k) * 4)], at: `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}` };
  });
  const funnel = [['Leads', t.leads], ['Qualified', t.qualified], ['Proposal', t.proposals], ['Won', t.won]];
  const fcol = ['var(--o1)', 'var(--o2)', 'var(--o3)', 'var(--o4)'];
  return `<div class="stack">
    <div class="kpis six">
      ${kpi({ ic: 'userPlus', label: 'Leads today', value: fmtN(today.leads), d: delta(today.leads, yest), foot: 'vs this time yesterday' })}
      ${kpi({ ic: 'users', label: 'Leads', value: fmtN(t.leads), d: delta(t.leads, tp.leads), spark: b.split(d => salesDay(d).leads) })}
      ${kpi({ ic: 'target', label: 'Qualified', value: fmtN(t.qualified), d: delta(t.qualified, tp.qualified), foot: pct(t.leads ? t.qualified / t.leads : 0, 0) + ' of leads' })}
      ${kpi({ ic: 'check', label: 'Deals won', value: fmtN(t.won), d: delta(t.won, tp.won), spark: b.split(d => salesDay(d).won) })}
      ${kpi({ ic: 'dollar', label: 'Revenue won', value: moneyK(t.revenue), d: delta(t.revenue, tp.revenue), spark: b.split(d => salesDay(d).revenue) })}
      ${kpi({ ic: 'sales', label: 'Win rate', value: pct(conv), d: delta(conv, convP), foot: 'Pipeline ' + moneyK(pipeline) })}
    </div>
    <div class="grid">
      <article class="card c8">
        <div class="card-h"><h3>Leads by source</h3><span class="sub">${byUnit(b)}</span></div>
        ${legend(SOURCES)}
        <div class="chart" data-chart="sales-leads"></div>
      </article>
      <article class="card c4">
        <div class="card-h"><h3>Pipeline</h3><span class="sub">${rangeLabel()}</span></div>
        <div class="funnel">${funnel.map(([name, v], i) => `<div class="fstep"><span>${name}</span><div><div class="fbar num" style="width:${Math.max(8, v / (t.leads || 1) * 100)}%;background:${fcol[i]};${i > 1 ? 'color:#fff' : ''}" data-tip="${attr(tipHTML(name, [{ name: 'Count', value: fmtN(v) }]))}">${fmtN(v)}</div></div><span class="conv">${i ? pct(funnel[i - 1][1] ? v / funnel[i - 1][1] : 0, 0) : ''}</span></div>`).join('')}</div>
        <div class="sm-muted">Right column: conversion from the stage above</div>
        <div class="list">${SOURCES.map((s, i) => ({ s, v: t.bySource[i] })).sort((a, c) => c.v - a.v).map(x => `<div class="row" style="font-size:13.5px"><span style="display:inline-flex;align-items:center;gap:8px">${sw(x.s.color)}${x.s.name}</span><span class="num"><b style="font-weight:600">${fmtN(x.v)}</b> <span style="color:var(--muted)">${pct(t.leads ? x.v / t.leads : 0, 0)}</span></span></div>`).join('')}</div>
      </article>
    </div>
    <div class="grid">
      <article class="card c7">
        <div class="card-h"><h3>Latest leads</h3><span class="sub">${today.leads} today so far</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Lead</th><th>Source</th><th>Owner</th><th>Time</th><th>Stage</th></tr></thead><tbody>
        ${recent.map(l => `<tr><td><div class="who">${av(l.name)}<div style="min-width:0"><b>${l.name}</b><small>${l.company}</small></div></div></td><td><span style="display:inline-flex;align-items:center;gap:7px;white-space:nowrap">${sw(l.src.color)}${l.src.name}</span></td><td style="white-space:nowrap">${l.owner.split(' ')[0]}</td><td class="num" style="color:var(--muted)">${l.at}</td><td>${pill(l.stage.c, l.stage.n)}</td></tr>`).join('')}
        </tbody></table></div>
      </article>
      <article class="card c5">
        <div class="card-h"><h3>Sales team</h3><span class="sub">${rangeLabel()}</span></div>
        <div class="tbl-wrap"><table><thead><tr><th>Rep</th><th class="r">Leads</th><th class="r">Won</th><th class="r">Revenue</th></tr></thead><tbody>
        ${reps.map((r, i) => `<tr><td><div class="who"><span class="sm-muted num" style="width:14px">${i + 1}</span>${av(r.name)}<div style="min-width:0;flex:1"><b>${r.name}</b><div class="track" style="margin-top:6px"><span style="width:${r.rev / maxRev * 100}%"></span></div></div></div></td><td class="r">${fmtN(r.leads)}</td><td class="r">${fmtN(r.won)}</td><td class="r"><b style="font-weight:600">${moneyK(r.rev)}</b></td></tr>`).join('')}
        </tbody></table></div>
      </article>
    </div>
  </div>`;
}

function vTasks() {

  const doneT = doneBetween(T, T), doneR = doneBetween(state.start, state.end), pv = prev(), doneP = doneBetween(pv.s, pv.e);
  const f = state.taskFilter;
  const shown = TASKS.filter(t => (!f.client || taskClient(t) === f.client) && (!f.assignee || t.assignee === f.assignee) && (!f.status || t.status === f.status) && (!f.q || (t.title + ' ' + t.project).toLowerCase().includes(f.q.toLowerCase())));

    const mine = TASKS.filter(t => t.assignee === name);

  }).map(p => ({ ...p, open: p.todo + p.doing + p.review })).sort((a, c) => c.open - a.open);
  const maxOpen = Math.max(...people.map(p => p.open), 1);
  const card = t => `<div class="tcard">

  return `<div class="stack">

/* =====================================================================

   ===================================================================== */

  const first = new Date(m.y, m.m, 1), startIdx = idxOf(first) - first.getDay(), lastIdx = idxOf(new Date(m.y, m.m + 1, 0));
  const cells = Math.ceil((lastIdx - startIdx + 1) / 7) * 7;
  const review = POSTS.filter(p => p.status === 'review').sort(postSort), changes = POSTS.filter(p => p.status === 'changes');
  const today = POSTS.filter(p => p.day === T).sort(postSort);
  const inWeek = POSTS.filter(p => p.day >= T && p.day <= T + 6);
  return `<div class="stack">
    <div class="kpis six">

      ${kpi({ ic: 'alert', label: 'Changes requested', value: changes.length, d: changes.length ? pill('serious', 'Fix') : '' })}
      ${kpi({ ic: 'file', label: 'Drafts', value: POSTS.filter(p => p.status === 'draft').length })}

    </div>
    <div class="grid">
      <article class="card c9">
        <div class="card-h">
          <div class="bar-l"><button class="go" data-cal="-1" aria-label="Previous month">‹</button><h3 style="min-width:130px;justify-content:center">${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3><button class="go" data-cal="1" aria-label="Next month">›</button><button class="btn sm" data-cal="0">Today</button></div>
          <div class="toolbar">
            <select id="cfAcct" aria-label="Account"><option value="">All accounts</option>${[ACCT_TENT, ...CLIENTS].map(a => `<option value="${a.id}" ${f.acct === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
            <select id="cfStatus" aria-label="Status"><option value="">All statuses</option>${Object.entries(POST_STATUS).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v.n}</option>`).join('')}</select>
            <button class="btn primary" data-newpost="">+ Schedule post</button>
          </div>
        </div>
        <div class="legend">${Object.entries(POST_STATUS).map(([k, v]) => `<span><i class="st-${k}"></i>${v.n}</span>`).join('')}</div>
        <div class="cal-wrap"><div class="cal">
          ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-hd">${d}</div>`).join('')}
          ${Array.from({ length: cells }, (_, i) => {
            const d = startIdx + i, dt = dateOf(d), ps = list.filter(p => p.day === d).sort(postSort);
            return `<div class="cal-day ${dt.getMonth() !== m.m ? 'out' : ''} ${d === T ? 'today' : ''}"><span class="dn">${dt.getDate()}</span>
              ${ps.slice(0, 3).map(p => `<button class="cal-chip st-${p.status}" data-post="${p.id}" title="${attr(esc(acctOf(p.acct).name + ' · ' + p.time + ' · ' + POST_STATUS[p.status].n + ' — ' + p.caption))}">${platDots(p.plats)}<span>${p.time} ${esc(acctShort(p.acct))}</span></button>`).join('')}

    </div>

  </button>`;
}
function vInfluencers() {

const RENDER = {
  overview: [vOverview, afterOverview], social: [vSocial, afterSocial], sales: [vSales, afterSales], tasks: [vTasks, null], hr: [vHR, afterHR], finance: [vFinanceTabs, afterFinanceTabs],

}

function go(target) {

  const nc = t.closest('[data-newcamp]'); if (nc) { openCampDialog(nc.dataset.newcamp); return; }
