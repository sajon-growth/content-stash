<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tentcomm Ops Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: white sidebar + soft grey workspace of rounded white cards; overview adds a right-hand insights column. Minimal chrome, one indigo accent, black primary actions. */
:root {
  --bg: #efeff2;
  --side: #ffffff;
  --main: #f7f7f9;
  --card: #ffffff;
  --sunk: #f4f4f6;
  --ink: #18181b;
  --ink-2: #52525b;
  --muted: #8b8b96;
  --line: #ebebef;
  --line-2: #dcdce2;
  --accent: #5b4fe0;
  --accent-soft: #efedfd;
  --accent-ink: #4a3fc4;
  --cta: #18181b;
  --cta-ink: #ffffff;
  --tip: #18181b;
  --tip-ink: #f4f4f5;

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --o1: #c7c2f6; --o2: #9d94ee; --o3: #7468e6; --o4: #5b4fe0;
  --good: #16a34a; --warn: #f5a524; --serious: #ec835a; --crit: #dc3b3b; --neutral: #a1a1aa;
  --good-ink: #15803d; --warn-ink: #9a6206; --crit-ink: #c02a2a;
  --good-soft: #ecf8f0; --warn-soft: #fef5e4; --crit-soft: #fdeeee; --serious-soft: #fdf0ea; --neutral-soft: #f1f1f4;
  --good-line: #bfe6cc; --warn-line: #f6dca8; --crit-line: #f5c4c4; --serious-line: #f6cdbb; --neutral-line: #e2e2e8; --accent-line: #d4cffa;

  --f: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Geist", system-ui, sans-serif;
  --r: 16px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09090b; --side: #111114; --main: #0d0d10; --card: #15151a; --sunk: #1b1b21;
    --ink: #f4f4f5; --ink-2: #b4b4bd; --muted: #7c7c88; --line: #24242b; --line-2: #31313a;
    --accent: #8f86f0; --accent-soft: #221f3d; --accent-ink: #b3adf6; --cta: #f4f4f5; --cta-ink: #18181b; --tip: #2a2a32; --tip-ink: #f4f4f5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    --o1: #2f2a5c; --o2: #4a4194; --o3: #6a5fd0; --o4: #8f86f0;
    --good-ink: #4ade80; --warn-ink: #fbbf24; --crit-ink: #f87171;
    --good-soft: #0f2418; --warn-soft: #2a2010; --crit-soft: #2c1414; --serious-soft: #2c1a12; --neutral-soft: #1e1e24;
    --good-line: #1d4a2c; --warn-line: #4d3a14; --crit-line: #5a2424; --serious-line: #55301f; --neutral-line: #33333c; --accent-line: #3b3570;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09090b; --side: #111114; --main: #0d0d10; --card: #15151a; --sunk: #1b1b21;
  --ink: #f4f4f5; --ink-2: #b4b4bd; --muted: #7c7c88; --line: #24242b; --line-2: #31313a;
  --accent: #8f86f0; --accent-soft: #221f3d; --accent-ink: #b3adf6; --cta: #f4f4f5; --cta-ink: #18181b; --tip: #2a2a32; --tip-ink: #f4f4f5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --o1: #2f2a5c; --o2: #4a4194; --o3: #6a5fd0; --o4: #8f86f0;
  --good-ink: #4ade80; --warn-ink: #fbbf24; --crit-ink: #f87171;
  --good-soft: #0f2418; --warn-soft: #2a2010; --crit-soft: #2c1414; --serious-soft: #2c1a12; --neutral-soft: #1e1e24;
  --good-line: #1d4a2c; --warn-line: #4d3a14; --crit-line: #5a2424; --serious-line: #55301f; --neutral-line: #33333c; --accent-line: #3b3570;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f); -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--card); display: grid; place-items: center; }
.brand .mark svg { width: 16px; height: 16px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 0 10px 6px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-weight: 500; border: 1px solid transparent; }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: 0 1px 2px rgba(24,24,27,.06); font-weight: 600; }
.nav .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--crit-ink); background: var(--crit-soft); border: 1px solid var(--crit-line); min-width: 22px; height: 20px; border-radius: 999px; display: grid; place-items: center; padding: 0 6px; }
.side-card { margin-top: auto; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--main); }
.side-card b { font-weight: 600; }
.side-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.me { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.me b { display: block; font-weight: 600; font-size: 13.5px; }
.me small { color: var(--muted); font-size: 12px; }

.main { min-width: 0; background: var(--main); display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: var(--side); flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.synced { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; width: 280px; max-width: 100%; color: var(--muted); background: var(--card); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--card); display: grid; place-items: center; color: var(--ink-2); position: relative; }
.icon-btn:hover { color: var(--ink); background: var(--sunk); }
.icon-btn .pip { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--crit); box-shadow: 0 0 0 2px var(--card); }
.av { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line-2); }
.av.lg { width: 38px; height: 38px; font-size: 13px; background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }

.content { padding: 22px 28px 48px; display: flex; flex-direction: column; gap: 18px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar-l { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 9px; font-weight: 500; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.card-h .seg { max-width: 100%; overflow-x: auto; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(24,24,27,.08), 0 0 0 1px var(--line); }
.custom { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.custom input { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 9px; font-size: 13px; }
.range-note { color: var(--muted); font-size: 13px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--warn-line); background: var(--warn-soft); color: var(--warn-ink); }

/* ---------- grid + cards ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.card.flat { background: transparent; border: 0; padding: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.card-h .sub { color: var(--muted); font-size: 13px; }
.card-sub { color: var(--muted); font-size: 13px; margin-top: -12px; }
.ghost { border: 1px solid var(--line-2); background: var(--card); border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.ghost:hover { background: var(--sunk); }
.ghost svg.i { width: 15px; height: 15px; }
.go { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); }
.go:hover { background: var(--sunk); color: var(--ink); }
.go svg.i { width: 15px; height: 15px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }
.kpis.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; }
button.kpi:hover { border-color: var(--line-2); box-shadow: 0 4px 16px rgba(24,24,27,.05); }
.kpi-h { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-weight: 500; font-size: 13.5px; }
.kpi-h svg.i { width: 16px; height: 16px; color: var(--ink); }
.kpi .val { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi .foot { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.kpi svg.spark { width: 100%; height: 28px; }

.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 12px; padding: 1px 7px; border-radius: 999px; border: 1px solid; font-variant-numeric: tabular-nums; }
.delta.up { color: var(--good-ink); background: var(--good-soft); border-color: var(--good-line); }
.delta.down { color: var(--crit-ink); background: var(--crit-soft); border-color: var(--crit-line); }
.delta.flat { color: var(--ink-2); background: var(--neutral-soft); border-color: var(--neutral-line); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 8px; border: 1px solid; white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit-ink); border-color: var(--crit-line); }
.pill.serious { background: var(--serious-soft); color: var(--crit-ink); border-color: var(--serious-line); }
.pill.warn { background: var(--warn-soft); color: var(--warn-ink); border-color: var(--warn-line); }
.pill.good { background: var(--good-soft); color: var(--good-ink); border-color: var(--good-line); }
.pill.neutral { background: var(--neutral-soft); color: var(--ink-2); border-color: var(--neutral-line); }
.pill.info { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 3px; height: 13px; border-radius: 2px; display: inline-block; }
.legend i.dash { background: repeating-linear-gradient(var(--muted) 0 3px, transparent 3px 5px) !important; }
.sw { width: 8px; height: 8px; border-radius: 3px; display: inline-block; flex: none; }

.chart { width: 100%; min-height: 60px; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11.5px; font-family: var(--f); font-variant-numeric: tabular-nums; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .base-l { stroke: var(--line-2); stroke-width: 1; }
.chart .xhair { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }

/* barcode meter */
.meter { display: flex; gap: 3px; height: 34px; }
.meter i { flex: 1; border-radius: 2px; background: var(--line); }
.meter.sm { height: 22px; gap: 2px; }
.meter-foot { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); gap: 8px; }
.big { font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }

.tbl-wrap { overflow-x: auto; margin-inline: -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--muted); font-size: 12.5px; display: block; }
.sm-muted { font-size: 12.5px; color: var(--muted); }

.hbar { display: flex; gap: 2px; height: 8px; width: 100%; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.hbar > span { display: block; height: 100%; min-width: 0; }
.hbar.tall { height: 12px; }
.track { position: relative; height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.track > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }

.list { display: flex; flex-direction: column; }
.list > * { padding-block: 12px; border-bottom: 1px solid var(--line); }
.list > *:first-child { padding-top: 0; }
.list > *:last-child { border-bottom: 0; padding-bottom: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.btn { border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 14px; font-weight: 500; font-size: 13.5px; background: var(--card); color: var(--ink); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }
.btn.primary:hover { opacity: .88; }
.btn.sm { padding: 5px 11px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn { border: 1px solid var(--line-2); display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px; border-radius: 999px; background: var(--card); font-weight: 500; font-size: 13px; color: var(--ink-2); }
.chip-btn:hover { color: var(--ink); }
.chip-btn[aria-pressed="true"] { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); }

/* overview aside */
.hello h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
.insights li { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; }
.insights li svg.i { width: 16px; height: 16px; margin-top: 2px; color: var(--ink); }
.insights b { color: var(--ink); font-weight: 600; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.action { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 18px; text-align: left; font-weight: 500; font-size: 13.5px; line-height: 1.35; min-height: 96px; }
.action:hover { border-color: var(--line-2); background: var(--sunk); }
.action svg.i { width: 18px; height: 18px; }
.snap { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding-inline: 0; text-align: left; }
.snap .ic { width: 32px; height: 32px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); flex: none; }
.snap .ic svg.i { width: 16px; height: 16px; }
.snap span.l { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snap b { font-weight: 600; font-variant-numeric: tabular-nums; }
.snap:hover span.l { color: var(--ink); }

/* platform cards */
.plat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.plat { border: 1px solid var(--line); text-align: left; background: var(--card); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.plat:hover { border-color: var(--line-2); }
.plat.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.plat-h { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.plat-h .delta { margin-left: auto; }
.plat .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; font-size: 12.5px; }
.plat .stats span { color: var(--muted); }
.plat .stats b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.plat svg { width: 100%; height: 34px; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: 10px; }
.fstep { display: grid; grid-template-columns: 84px minmax(0, 1fr) 44px; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.fstep .fbar { height: 30px; border-radius: 8px; display: flex; align-items: center; padding-left: 10px; font-weight: 600; font-size: 13px; min-width: 38px; color: var(--ink); }
.fstep .conv { color: var(--muted); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }

/* tasks board */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar select, .toolbar input { background: var(--card); border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 11px; font-size: 13px; }
.toolbar input { min-width: 0; flex: 1 1 160px; max-width: 280px; }
.toolbar .btn.primary { margin-left: auto; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.col { background: var(--sunk); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.col-h { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; padding: 4px 6px 6px; }
.col-h .n { color: var(--muted); font-weight: 500; margin-left: auto; }

<script>
/* =====================================================================

   ===================================================================== */
const CONFIG = {
  company: 'Tentcomm',
  currency: '$',          // e.g. '৳', '€', '£'
  weekend: [5, 6],        // 0 = Sun … 6 = Sat. Fri + Sat by default.
};

/* =====================================================================
   Date helpers. A "day" is an integer index (days since 2020-01-01, local).
   ===================================================================== */
const DAY = 864e5;
const EPOCH = new Date(2020, 0, 1);
const idxOf = d => Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / DAY);
const dateOf = i => new Date(2020, 0, 1 + i);
const NOW = new Date();
const T = idxOf(NOW);
const NOW_H = NOW.getHours() + NOW.getMinutes() / 60;
const frac = d => d > T ? 0 : d === T ? Math.max(0.08, NOW_H / 24) : 1;
const isWeekend = d => CONFIG.weekend.includes(dateOf(d).getDay());
const toISO = i => { const d = dateOf(i); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fromISO = s => { const [y, m, dd] = s.split('-').map(Number); return idxOf(new Date(y, m - 1, dd)); };
const fmtDay = (i, opts = { month: 'short', day: 'numeric' }) => dateOf(i).toLocaleDateString('en-US', opts);
const relDay = i => i === T ? 'Today' : i === T + 1 ? 'Tomorrow' : i === T - 1 ? 'Yesterday' : fmtDay(i);
const relLow = i => Math.abs(i - T) <= 1 ? relDay(i).toLowerCase() : fmtDay(i);

/* deterministic pseudo-random from any keys, so sample numbers stay stable */
function R(...keys) {
  let h = 2166136261;
  for (const k of keys) { const s = String(k); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= 0x9e; h = Math.imul(h, 16777619); }
  let t = (h + 0x6D2B79F5) >>> 0;
  t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

/* formatting */
const nf = new Intl.NumberFormat('en-US');
const fmtN = n => nf.format(Math.round(n));
const fmtK = n => { const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e4 ? (n / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : fmtN(n); };
const money = n => (n < 0 ? '−' : '') + CONFIG.currency + fmtN(Math.abs(n));
const moneyK = n => (n < 0 ? '−' : '') + CONFIG.currency + fmtK(Math.abs(n));
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => n.split(' ').map(p => p[0]).slice(0, 2).join('');
const sum = a => a.reduce((x, y) => x + y, 0);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem('opsdesk.' + key)); localStorage.setItem('opsdesk.' + key, JSON.stringify(val)); } catch (e) { return null; } }

/* =====================================================================
   SAMPLE DATA — replace each generator with an API call when you build.
   ===================================================================== */
const PLATFORMS = [
  { id: 'facebook',  name: 'Facebook',  color: 'var(--s1)', base: 48200, nf: 42, reach: 14500, er: 0.031 },
  { id: 'instagram', name: 'Instagram', color: 'var(--s2)', base: 36750, nf: 68, reach: 18200, er: 0.046 },
  { id: 'linkedin',  name: 'LinkedIn',  color: 'var(--s3)', base: 12480, nf: 24, reach: 5200,  er: 0.052 },
  { id: 'tiktok',    name: 'TikTok',    color: 'var(--s4)', base: 22900, nf: 95, reach: 26500, er: 0.061 },
  { id: 'youtube',   name: 'YouTube',   color: 'var(--s5)', base: 8640,  nf: 18, reach: 6100,  er: 0.038 },
  { id: 'x',         name: 'X',         color: 'var(--s6)', base: 9310,  nf: 11, reach: 4300,  er: 0.019 },
];
const socialMemo = new Map();
function socialDay(p, d) {
  const k = p.id + d; if (socialMemo.has(k)) return socialMemo.get(k);
  const r = R('s', p.id, d), r2 = R('s2', p.id, d), f = frac(d);
  const wave = 1 + 0.15 * Math.sin(d / 5 + PLATFORMS.indexOf(p));
  const trend = 1 + (d - T) * 0.002;
  const reach = Math.round(p.reach * wave * trend * (0.75 + 0.5 * r) * f);
  const engagements = Math.round(reach * p.er * (0.7 + 0.6 * r2));
  const o = {
    reach, engagements,
    impressions: Math.round(reach * (1.4 + 0.4 * r2)),
    newFollowers: Math.round(p.nf * wave * trend * (0.6 + 0.8 * r) * f),
    posts: f < 1 ? (r2 < 0.5 ? 1 : 0) : (r2 < 0.3 ? 0 : r2 < 0.8 ? 1 : 2),
    clicks: Math.round(engagements * 0.22),
  };
  socialMemo.set(k, o); return o;
}
function followersAt(p, end) { let f = p.base; for (let d = T - 180; d <= end; d++) f += socialDay(p, d).newFollowers; return f; }

const SOURCES = [
  { name: 'Meta Ads', w: .26, color: 'var(--s1)' }, { name: 'Google Ads', w: .22, color: 'var(--s2)' },
  { name: 'Website', w: .18, color: 'var(--s3)' }, { name: 'Referral', w: .12, color: 'var(--s4)' },
  { name: 'LinkedIn', w: .12, color: 'var(--s5)' }, { name: 'Cold outreach', w: .10, color: 'var(--s6)' },
];
const REPS = ['Nadia Karim', 'Tom Becker', 'Priya Nair', 'Omar Siddiqui', 'Lena Ortiz'];
const salesMemo = new Map();
function salesDay(d) {
  if (salesMemo.has(d)) return salesMemo.get(d);
  const r = R('l', d), f = frac(d), wk = isWeekend(d) ? 0.4 : 1, trend = 1 + (d - T) * 0.003;
  const bySource = SOURCES.map((s, i) => Math.round(30 * wk * trend * s.w * (0.6 + 0.8 * R('ls', d, i)) * f));
  const leads = sum(bySource);
  const qualified = Math.round(leads * (0.36 + 0.14 * r));
  const proposals = Math.round(qualified * (0.42 + 0.16 * R('lp', d)));
  const won = Math.round(proposals * (0.32 + 0.2 * R('lw', d)));

  const o = { leads, bySource, qualified, proposals, won, revenue };
  salesMemo.set(d, o); return o;

const ACCOUNTS = [

const CASH_NOW = sum(ACCOUNTS.map(a => a.bal));
const EXP_CATS = [

function financeDay(d) {
  if (finMemo.has(d)) return finMemo.get(d);

  const o = { cashIn, cashOut: sum(cats), cats };
  finMemo.set(d, o); return o;

function seedTasks() {

  PAYABLES.filter(p => p.due <= T + 3).forEach(p => a.push({ sev: p.due < T ? 'crit' : p.due === T ? 'serious' : 'warn', st: p.due < T ? `Overdue ${T - p.due}d` : p.due === T ? 'Due today' : `Due in ${p.due - T}d`, t: `Pay ${p.vendor}`, s: p.cat, area: 'Finance', amt: money(p.amt), go: 'finance' }));
  const od = overdueTasks();
  if (od.length) a.push({ sev: 'crit', st: `${od.length} overdue`, t: 'Tasks past their due date', s: [...new Set(od.map(t => t.assignee.split(' ')[0]))].join(', '), area: 'Tasks', amt: `${od.length} tasks`, go: 'tasks' });
  const pl = pendingLeaves();
  if (pl.length) a.push({ sev: 'warn', st: 'Pending', t: 'Leave applications to review', s: pl.map(l => l.name.split(' ')[0]).join(', '), area: 'People', amt: `${pl.length} requests`, go: 'hr' });
  const nn = OUT_TODAY.filter(o => o.kind === 'absent');
  if (nn.length) a.push({ sev: 'serious', st: 'Absent', t: 'Absent without approved leave', s: nn.map(o => o.name).join(', '), area: 'People', amt: `${nn.length} people`, go: 'hr' });
  const order = { crit: 0, serious: 1, warn: 2 };
  return a.sort((x, y) => order[x.sev] - order[y.sev]);
}

/* ---------- TASKS ---------- */
function vTasks() {
  const open = openTasks(), od = overdueTasks();
  const doneT = doneBetween(T, T), doneR = doneBetween(state.start, state.end), pv = prev(), doneP = doneBetween(pv.s, pv.e);
  const f = state.taskFilter;
  const shown = TASKS.filter(t => (!f.assignee || t.assignee === f.assignee) && (!f.status || t.status === f.status) && (!f.q || (t.title + ' ' + t.project).toLowerCase().includes(f.q.toLowerCase())));
  const people = TEAM.map(name => {
    const mine = TASKS.filter(t => t.assignee === name);
    const c = st => mine.filter(t => t.status === st).length;
    return { name, todo: c('todo'), doing: c('doing'), review: c('review'), today: mine.filter(t => t.status === 'done' && t.doneAt === T).length, range: mine.filter(t => t.status === 'done' && t.doneAt >= state.start && t.doneAt <= state.end).length, overdue: mine.filter(t => t.status !== 'done' && t.due < T).length };
  }).map(p => ({ ...p, open: p.todo + p.doing + p.review })).sort((a, c) => c.open - a.open);
  const maxOpen = Math.max(...people.map(p => p.open), 1);
  const card = t => `<div class="tcard">
    <div class="t">${esc(t.title)}</div>
    <div class="meta"><span class="prio ${t.priority}">${t.priority}</span><span>${esc(t.project)}</span></div>
    <div class="row"><span class="who" style="font-size:13px">${av(t.assignee)}<span>${esc(t.assignee.split(' ')[0])}</span></span>${t.status === 'done' ? pill('good', 'Done ' + relLow(t.doneAt)) : dueChip(t.due)}</div>
    <label class="row" style="font-size:12.5px;color:var(--muted)">Move to
      <select data-move="${t.id}" aria-label="Status for ${attr(esc(t.title))}">${STATUSES.map(s => `<option value="${s.id}" ${s.id === t.status ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
    </label>
  </div>`;
  return `<div class="stack">
    <div class="kpis six">
      ${kpi({ ic: 'check', label: 'Done today', value: `${doneT.length}`, d: delta(doneT.length, doneBetween(T - 1, T - 1).length), foot: 'vs yesterday' })}
      ${kpi({ ic: 'layers', label: 'Completed', value: doneR.length, d: delta(doneR.length, doneP.length), foot: rangeLabel() })}
      ${kpi({ ic: 'box', label: 'Open tasks', value: open.length, foot: `${TASKS.filter(t => t.status === 'doing').length} in progress` })}
      ${kpi({ ic: 'alert', label: 'Overdue', value: `<span style="color:${od.length ? 'var(--crit-ink)' : 'inherit'}">${od.length}</span>`, d: od.length ? pill('crit', 'Act now') : pill('good', 'None') })}
      ${kpi({ ic: 'calendar', label: 'Due today', value: open.filter(t => t.due === T).length, foot: `${open.filter(t => t.due > T && t.due <= T + 7).length} more this week` })}
      ${kpi({ ic: 'eye', label: 'In review', value: TASKS.filter(t => t.status === 'review').length, foot: 'waiting for sign-off' })}
    </div>
    <div class="grid">
      <article class="card c7">
        <div class="card-h"><h3>Team workload</h3>${legend(STATUSES.slice(0, 3))}</div>
        <div class="tbl-wrap"><table><thead><tr><th>Person</th><th style="width:38%">Open tasks</th><th class="r">Today</th><th class="r">${rangeLabel(true)}</th><th class="r">Overdue</th></tr></thead><tbody>
        ${people.map(p => `<tr><td><button class="who" style="background:none;border:0;padding:0;text-align:left" data-person="${attr(p.name)}" title="Show ${attr(p.name)}'s tasks">${av(p.name)}<b>${esc(p.name)}</b></button></td>
          <td><div style="display:flex;align-items:center;gap:10px"><div style="width:${p.open / maxOpen * 100}%;min-width:6px">${hbar([{ name: 'To do', color: STATUSES[0].color, v: p.todo, label: p.name }, { name: 'In progress', color: STATUSES[1].color, v: p.doing, label: p.name }, { name: 'In review', color: STATUSES[2].color, v: p.review, label: p.name }], p.open)}</div><b class="num" style="font-weight:600">${p.open}</b></div></td>
          <td class="r">${p.today || '<span style="color:var(--muted)">0</span>'}</td><td class="r">${p.range}</td><td class="r">${p.overdue ? pill('crit', p.overdue) : '<span style="color:var(--muted)">0</span>'}</td></tr>`).join('')}
        </tbody></table></div>
      </article>
      <article class="card c5">
        <div class="card-h"><h3>Projects</h3><span class="sub">tasks done</span></div>
        <div class="list">${PROJECTS.map(pr => { const ts = TASKS.filter(t => t.project === pr), dn = ts.filter(t => t.status === 'done').length, ovd = ts.filter(t => t.status !== 'done' && t.due < T).length, p = ts.length ? dn / ts.length : 0; return `
          <div style="display:flex;flex-direction:column;gap:8px">

            ${meter(p, ovd ? 'var(--s2)' : 'var(--accent)', 44, 'sm')}

    <article class="card">
      <div class="card-h"><h3>Task board</h3><span class="sub">${shown.length} of ${TASKS.length} tasks</span></div>
      <div class="toolbar">
        <input id="fQ" type="search" placeholder="Search tasks or projects" value="${attr(esc(f.q))}" aria-label="Search tasks">
        <select id="fAssignee" aria-label="Filter by person"><option value="">Everyone</option>${TEAM.map(n => `<option ${f.assignee === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option>${STATUSES.map(s => `<option value="${s.id}" ${f.status === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
        ${f.assignee || f.status || f.q ? '<button class="btn sm" id="fClear" type="button">Clear filters</button>' : ''}
        <button class="btn primary" id="newTask" type="button">+ New task</button>
      </div>
      <div class="board">${STATUSES.map(s => {
        let col = shown.filter(t => t.status === s.id);
        col = s.id === 'done' ? col.sort((a, c) => c.doneAt - a.doneAt) : col.sort((a, c) => a.due - c.due);
        const extra = s.id === 'done' && col.length > 6 ? col.length - 6 : 0;
        return `<div class="col"><div class="col-h">${sw(s.color)}${s.name}<span class="n">${col.length}</span></div>

      }).join('')}</div>
    </article>
  </div>`;
}

  document.querySelectorAll('#rangeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.range === state.range));

  el.innerHTML = view();
  el.firstElementChild.classList.add('view-in');
  after && after();
  if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); if (f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); } }
  hideTip();
}
function go(view) { if (!VIEWS[view]) view = 'overview'; state.view = view; if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); render(); window.scrollTo({ top: 0 }); }

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const n = e.target.closest('#nav a'); if (n) { e.preventDefault(); go(n.dataset.view); return; }
  const r = e.target.closest('#rangeSeg button');
  if (r) { state.range = r.dataset.range; if (r.dataset.range !== 'custom') store('range', state.range); else if (!store('custom')) store('custom', { s: T - 13, e: T }); render(); return; }
  const ov = e.target.closest('[data-ov]'); if (ov) { state.ovMetric = ov.dataset.ov; render(); return; }
  const p = e.target.closest('[data-plat]'); if (p) { state.platform = p.dataset.plat; render(); return; }
  const lv = e.target.closest('[data-leave]');
  if (lv) { leaveDecisions[lv.dataset.leave] = lv.dataset.dec; store('leaves', leaveDecisions); const l = LEAVES.find(x => x.id === lv.dataset.leave); toast(`${l.name}'s ${l.type.toLowerCase()} ${lv.dataset.dec}`); render(); return; }
  const un = e.target.closest('[data-undo]'); if (un) { delete leaveDecisions[un.dataset.undo]; store('leaves', leaveDecisions); render(); return; }
  const per = e.target.closest('[data-person]'); if (per) { state.taskFilter.assignee = per.dataset.person; render(); q('.board').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (e.target.closest('#fClear')) { state.taskFilter = { assignee: '', status: '', q: '' }; render(); return; }
  if (e.target.closest('#newTask') || e.target.closest('#qaTask')) { openTaskDialog(); return; }
});
document.addEventListener('change', e => {
  const m = e.target.closest('[data-move]');
  if (m) { const t = TASKS.find(x => x.id === m.dataset.move); t.status = m.value; t.doneAt = m.value === 'done' ? T : null; saveTasks(); toast(`Moved to ${STATUSES.find(s => s.id === m.value).name}`); render(); return; }
  if (e.target.id === 'fAssignee') { state.taskFilter.assignee = e.target.value; render(); }
  if (e.target.id === 'fStatus') { state.taskFilter.status = e.target.value; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'fQ') { state.taskFilter.q = e.target.value; render('fQ'); } });
q('#searchForm').addEventListener('submit', e => { e.preventDefault(); state.taskFilter.q = q('#globalSearch').value.trim(); q('#globalSearch').value = ''; go('tasks'); });
q('#customBox').addEventListener('submit', e => {
  e.preventDefault();
  let s = q('#cStart').value ? fromISO(q('#cStart').value) : T - 13, en = q('#cEnd').value ? fromISO(q('#cEnd').value) : T;
  en = Math.min(en, T); if (s > en) [s, en] = [en, s];
  store('custom', { s, e: en }); render();
});
q('#cStart').max = q('#cEnd').max = toISO(T);

const dlg = q('#taskDlg');
q('#tAssignee').innerHTML = TEAM.map(n => `<option>${n}</option>`).join('');
q('#tProject').innerHTML = PROJECTS.map(n => `<option>${n}</option>`).join('');
q('#tStatus').innerHTML = STATUSES.slice(0, 3).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
function openTaskDialog() {
  q('#taskForm').reset(); q('#tErr').hidden = true;
  q('#tDue').value = toISO(T + 3);
  if (state.taskFilter.assignee) q('#tAssignee').value = state.taskFilter.assignee;
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  q('#tTitle').focus();
}
q('#tCancel').addEventListener('click', () => dlg.close());
q('#taskForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = q('#tTitle').value.trim();
  if (!title) { q('#tErr').textContent = 'Give the task a title.'; q('#tErr').hidden = false; return; }
  if (!q('#tDue').value) { q('#tErr').textContent = 'Pick a due date.'; q('#tErr').hidden = false; return; }
  TASKS.unshift({ id: 't' + Date.now(), title, assignee: q('#tAssignee').value, project: q('#tProject').value, priority: q('#tPriority').value, status: q('#tStatus').value, due: fromISO(q('#tDue').value), created: T, doneAt: null });
  saveTasks(); dlg.close(); toast('Task created'); render();
});

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const a = RENDER[state.view][1]; a && a(); }, 120); });
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
state.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
render();
</script>
</body>
</html>
